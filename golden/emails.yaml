# Golden dataset for the support-email classifier.
#
# Labeling rules (apply in order; every label below follows them):
#   1. Label by what the customer needs us to DO, not by keywords in the email.
#   2. Something that should work but doesn't (errors, crashes, emails not arriving,
#      limits misfiring) is `technical`, even when it involves users, passwords or plans.
#   3. Money moving or that should move (charges, refunds, credits, prices, invoices) is `billing`.
#   4. Changes to who has access or who owns the account (members, roles, email, cancel,
#      data deletion) are `account`.
#   5. Several requests in one email: label the first one raised.
#
# required_details: short strings the summary must keep. Each must appear verbatim in
# the email (the validator enforces this), so prefer codes, amounts and names over
# phrases a good summary might reword.
#
# None of these emails may duplicate a few-shot example in prompts/, or the eval would
# be testing memorization.

- id: billing-wrong-seat-count
  category: billing
  difficulty: clear
  email: Invoice INV-20431 shows 12 seats but we only have 9 users. Please correct it.
  required_details: [INV-20431, "12", "9"]

- id: billing-annual-switch
  category: billing
  difficulty: clear
  email: Can I switch from monthly to annual billing and get the 20% discount you advertise?
  required_details: [annual, 20%]

- id: billing-update-card
  category: billing
  difficulty: clear
  email: Our card ending 4417 expired. How do I update the payment method before our renewal at the end of the month?
  required_details: ["4417"]

- id: billing-refund-after-trial-cancel
  category: billing
  difficulty: ambiguous
  email: We cancelled during the 14-day trial but were still charged $1,188 for the annual plan. Refund please.
  required_details: ["$1,188", trial]
  notes: Mentions cancelling (account), but the ask is money back. Rule 3.

- id: billing-nonprofit-pricing
  category: billing
  difficulty: clear
  email: Do you offer nonprofit pricing? We're a registered 501(c)(3).
  required_details: [nonprofit]

- id: billing-unexplained-increase
  category: billing
  difficulty: clear
  email: Why did our bill go from $29 to $35 this month? Nobody told us about a price change.
  required_details: [$29, $35]

- id: billing-vat-invoice
  category: billing
  difficulty: clear
  email: Please reissue last month's invoice with our VAT number DE298765432 on it.
  required_details: [DE298765432]

- id: technical-webhook-502
  category: technical
  difficulty: clear
  email: Webhook deliveries to our ingest endpoint have failed with HTTP 502 since 9am UTC today.
  required_details: ["502", webhook]

- id: technical-ios-crash
  category: technical
  difficulty: clear
  email: The iOS app crashes on launch since I updated to 4.12.0. iPhone 15, iOS 18.1.
  required_details: [4.12.0, iOS]

- id: technical-slack-integration
  category: technical
  difficulty: clear
  email: "The Slack integration stopped posting notifications to our #deploys channel on Monday."
  required_details: [Slack, "#deploys"]

- id: technical-slow-dashboard
  category: technical
  difficulty: clear
  email: The dashboard now takes 40+ seconds to load for our whole team. It used to be instant.
  required_details: ["40"]

- id: technical-rate-limit-misfire
  category: technical
  difficulty: ambiguous
  email: The API keeps returning 429 Too Many Requests, but we're far under the 1,000 requests/minute our plan includes.
  required_details: ["429", "1,000"]
  notes: Mentions the plan (billing), but the limit is misfiring. Rule 2.

- id: technical-invite-limit-reached
  category: technical
  difficulty: ambiguous
  email: I upgraded to the Team plan yesterday but I still can't invite more than 3 users. Error says LIMIT_REACHED.
  required_details: [Team, "3", LIMIT_REACHED]
  notes: Mentions inviting users (account) and a plan (billing), but a feature errors after a valid upgrade. Rule 2.

- id: technical-password-reset-email
  category: technical
  difficulty: ambiguous
  email: Password reset emails never arrive. I've checked spam and tried 3 times.
  required_details: [password reset, "3"]
  notes: The prompt lists passwords under account, but the reset flow is broken. Rule 2. Prompt v1 is likely to disagree.

- id: account-change-email
  category: account
  difficulty: clear
  email: How do I change the email address on my account? I'm moving from my personal address to my work one.
  required_details: [email address]

- id: account-remove-member
  category: account
  difficulty: clear
