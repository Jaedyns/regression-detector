[project]
name = "regression-detector"
version = "0.1.0"
description = "CI-style regression detection for an LLM-powered email classifier"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
classify = "detector.cli:main"
validate-golden = "detector.golden:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]
